# 커밋할 때 스테이징된 파일만 검사한다. 저장소 전체는 mise run lint.
# 서브모듈(ops/, projects/)은 이 저장소에 커밋 포인터로만 잡히고 안의 파일은 스테이징되지 않으므로
# {staged_files} 에 들어오지 않는다. 서브모듈 자체의 훅은 각 서브모듈의 lefthook.yml 이 담당한다.
pre-commit:
  jobs:
    - name: markdownlint
      glob: "*.md"
      run: mise exec -- markdownlint-cli2 {staged_files}
